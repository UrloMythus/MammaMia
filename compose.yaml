services:
  mammamia:
    build: .
    image: mammamia:tv-proxy
    restart: unless-stopped
    ports:
      - "${MAMMAMIA_PORT:-8080}:8080"
    environment:
      TMDB_KEY: "${TMDB_KEY:?Set TMDB_KEY in .env}"
      HLS_PROXY_URL: "${HLS_PROXY_URL:?Set the TV-accessible HLS proxy URL in .env}"
      PROXY: '[""]'
      FORWARDPROXY: ""
    volumes:
      - ./config.json:/app/config.json:ro
